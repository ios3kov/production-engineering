name: REA repaired-source qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integrations/rea/runtime.py'
      - 'integrations/rea/repair-check.mjs'
      - 'integrations/rea/capability-check.mjs'
      - '.github/workflows/rea-repaired-qualification.yml'
permissions:
  contents: read
concurrency:
  group: rea-repaired-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repaired-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Install fixed source and Ghidra into a fresh private prefix
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/rea-install.XXXXXX")"
          echo "REA_PREFIX=$root/runtime" >> "$GITHUB_ENV"
          python3 integrations/rea/runtime.py install "$root/runtime" --apply
      - name: Verify installed bytes and exercise the actual static launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/rea/runtime.py verify "$REA_PREFIX"
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          root=Path(os.environ['REA_PREFIX'])
          with zipfile.ZipFile(root/'launcher-input.zip','w') as z:
              z.writestr('owned.txt','owned static fixture')
          PY
          python3 integrations/rea/runtime.py run "$REA_PREFIX" inventory "$REA_PREFIX/launcher-input.zip" --output "$REA_PREFIX/evidence/launcher"
          python3 integrations/rea/runtime.py config "$REA_PREFIX"
          cat "$REA_PREFIX/evidence/repair-report.json"
          cat "$REA_PREFIX/evidence/capability-report.json"
      - name: Retain executed checks and installation identity
        if: always() && env.REA_PREFIX != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-repaired-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ env.REA_PREFIX }}/evidence/
            ${{ env.REA_PREFIX }}/runtime.json
            ${{ env.REA_PREFIX }}/codex-fragment.toml
          retention-days: 30
          if-no-files-found: error
